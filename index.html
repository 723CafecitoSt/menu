<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ec">
  <meta name="description" content="723 Cafecito St. — current event menu and featured drinks in El Paso.">
  <title>723 Cafecito St. | Menu</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <img class="logo" src="assets/logo.png" alt="723 Cafecito St.">
    <a class="instagram" href="https://www.instagram.com/723cafecitostreet/" target="_blank" rel="noopener noreferrer">Instagram ↗</a>
  </header>
  <main>
    <section class="event" aria-labelledby="event-title">
      <p class="eyebrow">Find us at</p>
      <h1 id="event-title"></h1>
      <p id="event-details" class="event-details"></p>
      <a id="event-map" class="map-link" target="_blank" rel="noopener noreferrer">Get directions ↗</a>
    </section>
    <nav class="quicklinks" aria-label="Page sections"><a href="#featured">Featured drinks</a><a href="#menu">Full menu</a></nav>
    <section id="featured" class="featured" aria-labelledby="featured-title">
      <div class="section-heading"><p class="eyebrow">On the street</p><h2 id="featured-title">Featured drinks</h2></div>
      <div id="featured-list" class="featured-list"></div>
    </section>
    <section id="menu" class="menu" aria-labelledby="menu-title">
      <div class="section-heading"><p class="eyebrow">Take a look</p><h2 id="menu-title">The menu</h2></div>
      <div id="menu-list" class="menu-list"></div>
      <p id="menu-note" class="menu-note"></p>
    </section>
  </main>
  <footer><img src="assets/logo.png" alt=""><p>Good drinks. Go further.</p><a href="https://www.instagram.com/723cafecitostreet/" target="_blank" rel="noopener noreferrer">@723cafecitostreet ↗</a></footer>
  <script src="menu.js"></script>
  <script src="site.js"></script>
</body>
</html>
